<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Atas - Igreja de Jesus Cristo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --light-bg: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
            --border-radius: 12px;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { background-color: var(--light-bg); color: var(--text-color); line-height: 1.6; }

        /* Header */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .header-title h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
        .header-status { font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: #95a5a6; }
        .status-dot.online { background-color: var(--success-color); }
        .status-dot.offline { background-color: var(--danger-color); }
        .status-dot.connecting { background-color: #f1c40f; }
        .status-dot.saving { background-color: var(--warning-color); }

        /* Toolbar fica presa no topo ao rolar o formulário */
        .toolbar {
            background: white;
            padding: 0.8rem 2rem;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .btn-primary { background-color: var(--accent-color); color: white; }
        .btn-success { background-color: var(--success-color); color: white; }
        .btn-secondary { background-color: var(--secondary-color); color: white; }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn kbd { font-size: 0.7rem; opacity: 0.75; font-family: inherit; }

        @media (max-width: 700px) {
            .toolbar { padding: 0.6rem 1rem; }
            .toolbar .btn span.label-long { display: none; }
            .btn kbd { display: none; }
        }

        main {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 2rem;
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }
        @media (max-width: 1024px) { main { grid-template-columns: 1fr; padding: 1rem; } }

        .card { background: var(--card-bg); border-radius: var(--border-radius); padding: 2rem; box-shadow: var(--shadow); }
        @media (max-width: 700px) { .card { padding: 1.2rem; } }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--light-bg);
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .dirty-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--warning-color);
            background: #fef5e7;
            padding: 2px 10px;
            border-radius: 10px;
        }

        .form-section { margin-bottom: 2rem; background: #fcfcfc; padding: 1.5rem; border-radius: 10px; border: 1px solid #eee; }
        .form-section h3 { font-size: 1rem; margin-bottom: 1rem; color: var(--accent-color); text-transform: uppercase; letter-spacing: 1px; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.2rem; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: #666; }
        .form-group input, .form-group select, .form-group textarea {
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group textarea { resize: vertical; overflow: hidden; min-height: 3.2rem; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent-color); }
        .form-group .hint { font-size: 0.75rem; color: #999; }
        .full-width { grid-column: 1 / -1; }

        .search-box { margin-bottom: 1.5rem; display: flex; gap: 10px; }
        .search-box input { flex: 1; padding: 0.6rem; border: 1px solid #ddd; border-radius: 6px; }

        .ata-list { display: flex; flex-direction: column; gap: 1rem; max-height: 800px; overflow-y: auto; padding-right: 5px; }
        .ata-item { border: 1px solid #eee; border-radius: 8px; padding: 1rem; transition: all 0.2s; cursor: pointer; position: relative; }
        .ata-item:hover { border-color: var(--accent-color); background-color: #f9fbff; }
        .ata-item.active { border-left: 5px solid var(--accent-color); background-color: #f0f7ff; }
        .ata-item-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
        .ata-type-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; font-weight: 700; }
        .badge-sacramental { background: #e3f2fd; color: #1976d2; }
        .badge-testemunho { background: #f3e5f5; color: #7b1fa2; }
        .ata-item-info { font-size: 0.85rem; color: #666; }
        .ata-item-actions { display: flex; gap: 8px; margin-top: 0.8rem; }
        .btn-icon { padding: 5px 10px; font-size: 0.8rem; }
        .pending-tag { font-size: 0.7rem; color: var(--warning-color); margin-left: 6px; }
        .empty-msg { text-align: center; color: #999; margin-top: 2rem; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #aaa; }

        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            max-width: calc(100vw - 40px);
            padding: 1rem 2rem;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 2000;
            display: none;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1><i class="fas fa-church"></i> Gestão de Atas</h1>
        </div>
        <div class="header-status" id="connection-status">
            <div class="status-dot connecting"></div>
            <span id="status-text">Conectando ao Firebase...</span>
        </div>
    </header>

    <div class="toolbar">
        <button class="btn btn-primary" id="btn-nova"><i class="fas fa-plus"></i> Nova Ata</button>
        <button class="btn btn-success" id="btn-salvar"><i class="fas fa-save"></i> Salvar <kbd>Ctrl+S</kbd></button>
        <button class="btn btn-secondary" id="btn-pdf"><i class="fas fa-file-pdf"></i> Gerar PDF</button>
        <div style="flex-grow: 1;"></div>
        <button class="btn btn-secondary" id="btn-exportar"><i class="fas fa-download"></i> <span class="label-long">Exportar</span> Backup</button>
        <button class="btn btn-secondary" id="btn-importar-trigger"><i class="fas fa-upload"></i> <span class="label-long">Importar</span> Backup</button>
        <input type="file" id="import-file" accept=".json" class="hidden">
    </div>

    <main>
        <section class="card">
            <div class="card-title">
                <span id="form-mode-title">Nova Ata</span>
                <span id="dirty-badge" class="dirty-badge hidden">Alterações não salvas</span>
                <input type="hidden" id="ata-id">
            </div>

            <form id="ata-form" autocomplete="off">
                <div class="form-section">
                    <h3>Tipo de Ata</h3>
                    <div class="form-group">
                        <label for="tipo_ata">Selecione o Tipo de Reunião *</label>
                        <select id="tipo_ata" required>
                            <option value="sacramental">Reunião Sacramental</option>
                            <option value="testemunho">Reunião de Testemunho</option>
                        </select>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Informações Gerais</h3>
                    <div class="grid-form">
                        <div class="form-group">
                            <label for="estaca">Estaca</label>
                            <input type="text" id="estaca" value="Penha">
                        </div>
                        <div class="form-group">
                            <label for="ala">Ala</label>
                            <input type="text" id="ala" value="Vila Matilde">
                        </div>
                        <div class="form-group">
                            <label for="data">Data *</label>
                            <input type="date" id="data" required>
                        </div>
                        <div class="form-group">
                            <label for="presidida_por">Presidida por</label>
                            <input type="text" id="presidida_por" value="Wesley Brito">
                        </div>
                        <div class="form-group">
                            <label for="dirigida_por">Dirigida por</label>
                            <input type="text" id="dirigida_por">
                        </div>
                        <div class="form-group">
                            <label for="frequencia">Frequência</label>
                            <input type="number" id="frequencia" min="0" inputmode="numeric">
                        </div>
                        <div class="form-group">
                            <label for="regente">Regente</label>
                            <input type="text" id="regente">
                        </div>
                        <div class="form-group">
                            <label for="pianista">Pianista/Organista</label>
                            <input type="text" id="pianista" value="Ana Carolina Brito">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Abertura</h3>
                    <div class="grid-form">
                        <div class="form-group full-width">
                            <label for="boas_vindas">Boas-vindas / Reconhecimentos</label>
                            <textarea id="boas_vindas" rows="2"></textarea>
                        </div>
                        <div class="form-group full-width">
                            <label for="anuncios">Anúncios</label>
                            <textarea id="anuncios" rows="2"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="hino_abertura">Hino de Abertura</label>
                            <input type="text" id="hino_abertura">
                        </div>
                        <div class="form-group">
                            <label for="hino_abertura_num">Nº do Hino</label>
                            <input type="text" id="hino_abertura_num" inputmode="numeric">
                        </div>
                        <div class="form-group">
                            <label for="primeira_oracao">Primeira Oração</label>
                            <input type="text" id="primeira_oracao">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Ações</h3>
                    <div class="form-group">
                        <label for="acoes">Ordenanças / Desobrigações / Apoios</label>
                        <textarea id="acoes" rows="3"></textarea>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Sacramento</h3>
                    <div class="grid-form">
                        <div class="form-group">
                            <label for="hino_sacramental">Hino Sacramental</label>
                            <input type="text" id="hino_sacramental">
                        </div>
                        <div class="form-group">
                            <label for="hino_sacramental_num">Nº do Hino</label>
                            <input type="text" id="hino_sacramental_num" inputmode="numeric">
                        </div>
                    </div>
                </div>

                <div id="section-mensagens" class="form-section">
                    <h3>Mensagens</h3>
                    <div class="grid-form">
                        <div class="form-group">
                            <label for="primeiro_orador">Primeiro Orador</label>
                            <input type="text" id="primeiro_orador">
                        </div>
                        <div class="form-group">
                            <label for="segundo_orador">Segundo Orador</label>
                            <input type="text" id="segundo_orador">
                        </div>
                        <div class="form-group">
                            <label for="interludio">Interlúdio Musical</label>
                            <input type="text" id="interludio">
                        </div>
                        <div class="form-group">
                            <label for="interludio_num">Nº do Hino</label>
                            <input type="text" id="interludio_num" inputmode="numeric">
                        </div>
                        <div class="form-group">
                            <label for="ultimo_orador">Último Orador</label>
                            <input type="text" id="ultimo_orador">
                        </div>
                        <div class="form-group full-width">
                            <label for="observacoes">Observações</label>
                            <textarea id="observacoes" rows="2"></textarea>
                        </div>
                    </div>
                </div>

                <div id="section-testemunhos" class="form-section hidden">
                    <h3>Testemunhos</h3>
                    <div class="form-group">
                        <label for="testemunhos_lista">Nomes dos irmãos e irmãs (um por linha)</label>
                        <textarea id="testemunhos_lista" rows="6" placeholder="Maria Silva&#10;João Santos&#10;Ana Oliveira"></textarea>
                        <span class="hint">No PDF os nomes saem separados por vírgula, para caber em uma folha.</span>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Encerramento</h3>
                    <div class="grid-form">
                        <div class="form-group">
                            <label for="hino_encerramento">Último Hino</label>
                            <input type="text" id="hino_encerramento">
                        </div>
                        <div class="form-group">
                            <label for="hino_encerramento_num">Nº do Hino</label>
                            <input type="text" id="hino_encerramento_num" inputmode="numeric">
                        </div>
                        <div class="form-group">
                            <label for="ultima_oracao">Última Oração</label>
                            <input type="text" id="ultima_oracao">
                        </div>
                    </div>
                </div>
            </form>
        </section>

        <section class="card">
            <div class="card-title">Atas Salvas <span id="ata-count" style="font-size:0.85rem;color:#999;font-weight:500;"></span></div>
            <div class="search-box">
                <input type="search" id="search-input" placeholder="Pesquisar por data (12/10), ala, dirigente, orador ou tipo...">
            </div>
            <div class="ata-list" id="ata-list">
                <p class="empty-msg">Carregando atas...</p>
            </div>
        </section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script type="module">
        const firebaseConfig = {
            apiKey: "AIzaSyAQvf-5TQtg4O1NKhRCwdeuvbWFzMfXsak",
            authDomain: "minhas-atas.firebaseapp.com",
            projectId: "minhas-atas",
            storageBucket: "minhas-atas.firebasestorage.app",
            messagingSenderId: "1074820300427",
            appId: "1:1074820300427:web:3ab150a7856c7c40029e8e"
        };

        const COLLECTION = "atasSacramentais";

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const col = db.collection(COLLECTION);
        const { jsPDF } = window.jspdf;

        // Funciona sem internet: salva localmente e sincroniza quando a conexão voltar
        db.enablePersistence({ synchronizeTabs: true }).catch(err => console.warn('Persistência offline indisponível:', err.code));

        // Todos os campos do formulário (id do elemento = nome do campo no Firestore)
        const FIELDS = [
            'tipo_ata', 'estaca', 'ala', 'data', 'presidida_por', 'dirigida_por', 'frequencia', 'regente', 'pianista',
            'boas_vindas', 'anuncios', 'hino_abertura', 'hino_abertura_num', 'primeira_oracao', 'acoes',
            'hino_sacramental', 'hino_sacramental_num',
            'primeiro_orador', 'segundo_orador', 'interludio', 'interludio_num', 'ultimo_orador', 'observacoes',
            'testemunhos_lista',
            'hino_encerramento', 'hino_encerramento_num', 'ultima_oracao'
        ];
        const SACRAMENTAL_ONLY = ['primeiro_orador', 'segundo_orador', 'interludio', 'interludio_num', 'ultimo_orador', 'observacoes'];

        let atasCache = [];
        let currentFilter = "";
        let isDirty = false;
        let toastTimer = null;

        const $ = id => document.getElementById(id);
        const form = $('ata-form');
        const listContainer = $('ata-list');
        const statusDot = document.querySelector('.status-dot');
        const statusText = $('status-text');
        const tipoAtaSelect = $('tipo_ata');
        const toast = $('toast');

        // --- Utilitários ---

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

        function formatDate(dateStr) {
            if (!dateStr) return "";
            const [year, month, day] = dateStr.split('-');
            return `${day}/${month}/${year}`;
        }

        function showToast(message, type = 'success', ms = 3000) {
            clearTimeout(toastTimer);
            toast.textContent = message;
            toast.style.backgroundColor = { success: '#27ae60', error: '#e74c3c', info: '#2c3e50' }[type] || '#27ae60';
            toast.style.display = 'block';
            toastTimer = setTimeout(() => { toast.style.display = 'none'; }, ms);
        }

        function updateStatus(status) {
            statusDot.className = 'status-dot ' + status;
            statusText.textContent = {
                online: 'Conectado e sincronizado',
                offline: 'Erro ao conectar',
                connecting: 'Conectando ao Firebase...',
                saving: 'Sincronizando alterações...'
            }[status];
        }

        function setDirty(v) {
            isDirty = v;
            $('dirty-badge').classList.toggle('hidden', !v);
        }

        function confirmDiscard() {
            return !isDirty || confirm('Há alterações não salvas nesta ata. Deseja descartá-las?');
        }

        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 2 + 'px';
        }
        const growAll = () => form.querySelectorAll('textarea').forEach(autoGrow);

        function toggleSections() {
            const sac = tipoAtaSelect.value === 'sacramental';
            $('section-mensagens').classList.toggle('hidden', !sac);
            $('section-testemunhos').classList.toggle('hidden', sac);
            growAll();
        }

        // --- Formulário ---

        function collectForm() {
            const data = {};
            FIELDS.forEach(k => { data[k] = $(k).value; });
            if (data.tipo_ata === 'sacramental') {
                data.testemunhos_lista = "";
            } else {
                SACRAMENTAL_ONLY.forEach(k => { data[k] = ""; });
            }
            return data;
        }

        function fillForm(ata) {
            FIELDS.forEach(k => { $(k).value = ata[k] ?? ''; });
            if (!tipoAtaSelect.value) tipoAtaSelect.value = 'sacramental';
            toggleSections();
        }

        function clearForm() {
            if (!confirmDiscard()) return;
            form.reset();
            $('ata-id').value = '';
            $('form-mode-title').textContent = 'Nova Ata';
            setDirty(false);
            toggleSections();
            renderList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            $('data').focus();
        }

        function editAta(id) {
            if (id === $('ata-id').value) return;
            const ata = atasCache.find(a => a.id === id);
            if (!ata || !confirmDiscard()) return;
            $('ata-id').value = ata.id;
            $('form-mode-title').textContent = 'Editando Ata de ' + formatDate(ata.data);
            fillForm(ata);
            setDirty(false);
            renderList();
            if (window.innerWidth <= 1024) window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- Dados ---

        function sortAtas(list) {
            // Mais recente primeiro pela data da reunião, não pela data em que foi digitada
            return list.sort((a, b) => (b.data || '').localeCompare(a.data || '') ||
                ((b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
        }

        function loadAtas() {
            updateStatus('connecting');
            col.onSnapshot({ includeMetadataChanges: true }, snapshot => {
                atasCache = sortAtas(snapshot.docs.map(doc => ({
                    id: doc.id,
                    _pending: doc.metadata.hasPendingWrites,
                    ...doc.data()
                })));
                renderList();
                updateStatus(snapshot.metadata.hasPendingWrites ? 'saving' : (snapshot.metadata.fromCache && !navigator.onLine ? 'offline' : 'online'));
                if (!navigator.onLine) statusText.textContent = 'Sem internet: alterações ficam salvas no aparelho';
            }, error => {
                console.error("Erro no snapshot:", error);
                updateStatus('offline');
                listContainer.innerHTML = '<p class="empty-msg">Não foi possível carregar as atas.</p>';
            });
        }

        function renderList() {
            const terms = norm(currentFilter).split(/\s+/).filter(Boolean);
            const filtered = atasCache.filter(ata => {
                if (!terms.length) return true;
                const hay = norm([
                    formatDate(ata.data), ata.data, ata.ala, ata.dirigida_por, ata.presidida_por,
                    ata.tipo_ata === 'testemunho' ? 'testemunho' : 'sacramental',
                    ata.primeiro_orador, ata.segundo_orador, ata.ultimo_orador
                ].join(' '));
                return terms.every(t => hay.includes(t));
            });

            $('ata-count').textContent = atasCache.length ? `(${filtered.length}${filtered.length !== atasCache.length ? ' de ' + atasCache.length : ''})` : '';

            if (filtered.length === 0) {
                listContainer.innerHTML = '<p class="empty-msg">Nenhuma ata encontrada.</p>';
                return;
            }

            const activeId = $('ata-id').value;
            listContainer.innerHTML = filtered.map(ata => {
                const isTest = ata.tipo_ata === 'testemunho';
                const nTest = (ata.testemunhos_lista || '').split('\n').filter(s => s.trim()).length;
                const detalhe = isTest
                    ? `<div><strong>Testemunhos:</strong> ${nTest}</div>`
                    : `<div><strong>Oradores:</strong> ${esc([ata.primeiro_orador, ata.segundo_orador, ata.ultimo_orador].filter(Boolean).join(', ') || '-')}</div>`;
                return `
                <div class="ata-item ${activeId === ata.id ? 'active' : ''}" data-id="${esc(ata.id)}" data-action="edit">
                    <div class="ata-item-header">
                        <span class="ata-type-badge badge-${isTest ? 'testemunho' : 'sacramental'}">${isTest ? 'Testemunho' : 'Sacramental'}</span>
                        <span style="font-weight: 600;">${esc(formatDate(ata.data))}${ata._pending ? '<span class="pending-tag" title="Aguardando sincronização"><i class="fas fa-cloud-arrow-up"></i></span>' : ''}</span>
                    </div>
                    <div class="ata-item-info">
                        <div><strong>Dirigida por:</strong> ${esc(ata.dirigida_por || '-')}</div>
                        ${detalhe}
                    </div>
                    <div class="ata-item-actions">
                        <button class="btn btn-secondary btn-icon" data-action="edit" title="Editar"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-primary btn-icon" data-action="pdf" title="Gerar PDF"><i class="fas fa-file-pdf"></i></button>
                        <button class="btn btn-danger btn-icon" data-action="delete" title="Excluir"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            }).join('');
        }

        async function deleteAta(id) {
            const ata = atasCache.find(a => a.id === id);
            if (!ata) return;
            const nome = `${ata.tipo_ata === 'testemunho' ? 'Testemunho' : 'Sacramental'} de ${formatDate(ata.data)}`;
            if (!confirm(`Excluir a ata "${nome}"?\n\nIsso não pode ser desfeito. Se não tiver certeza, exporte um backup antes.`)) return;
            try {
                const p = col.doc(id).delete();
                if ($('ata-id').value === id) { setDirty(false); clearForm(); }
                showToast('Ata excluída.');
                await p;
            } catch (error) {
                console.error(error);
                showToast('Erro ao excluir ata', 'error');
            }
        }

        function saveAta() {
            const id = $('ata-id').value;
            const formData = collectForm();

            if (!formData.data) {
                showToast('Preencha a data da reunião.', 'error');
                $('data').focus();
                return false;
            }

            // Aviso de possível duplicata (mesma data e mesmo tipo)
            const dup = atasCache.find(a => a.id !== id && a.data === formData.data && a.tipo_ata === formData.tipo_ata);
            if (dup && !confirm(`Já existe uma ata deste tipo em ${formatDate(formData.data)}. Salvar mesmo assim?`)) return false;

            formData.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
            const ref = id ? col.doc(id) : col.doc();
            if (!id) formData.createdAt = firebase.firestore.FieldValue.serverTimestamp();

            // Não espera o servidor: com a persistência offline a gravação local é imediata.
            // Isso evita o botão "travado" com internet ruim e impede duplicata por clique duplo.
            ref.set(formData, { merge: true }).catch(error => {
                console.error("Erro ao salvar:", error);
                showToast('Erro ao salvar ata. Tente novamente.', 'error', 5000);
                setDirty(true);
            });

            $('ata-id').value = ref.id;
            $('form-mode-title').textContent = 'Editando Ata de ' + formatDate(formData.data);
            setDirty(false);
            showToast(id ? 'Ata atualizada!' : 'Ata criada!');
            return true;
        }

        // --- Backup ---

        function exportBackup() {
            if (atasCache.length === 0) {
                showToast('Não há dados para exportar', 'error');
                return;
            }
            const clean = atasCache.map(({ _pending, ...rest }) => rest);
            const blob = new Blob([JSON.stringify(clean, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_atas_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast(`Backup com ${clean.length} atas exportado.`);
        }

        const toTimestamp = v => (v && typeof v.seconds === 'number')
            ? new firebase.firestore.Timestamp(v.seconds, v.nanoseconds || 0)
            : null;

        function importBackup(event) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data)) throw new Error('Formato inválido');
                    if (!confirm(`Importar ${data.length} atas?\n\nAtas que já existem (mesmo ID) serão atualizadas, não duplicadas.`)) return;

                    updateStatus('saving');
                    // O Firestore aceita no máximo 500 operações por lote
                    for (let i = 0; i < data.length; i += 400) {
                        const batch = db.batch();
                        data.slice(i, i + 400).forEach(item => {
                            const { id, _pending, ...rest } = item;
                            rest.createdAt = toTimestamp(rest.createdAt) || firebase.firestore.FieldValue.serverTimestamp();
                            rest.updatedAt = toTimestamp(rest.updatedAt) || firebase.firestore.FieldValue.serverTimestamp();
                            batch.set(id ? col.doc(id) : col.doc(), rest);
                        });
                        await batch.commit();
                    }
                    showToast(`${data.length} atas importadas!`);
                } catch (error) {
                    console.error("Erro na importação:", error);
                    showToast('Erro ao importar backup. Verifique o arquivo.', 'error', 5000);
                    updateStatus('offline');
                }
            };
            reader.readAsText(file);
        }

        // --- PDF (sempre tenta caber em 1 folha) ---

        const PT_TO_MM = 0.3528;
        const LHF = 1.25;          // fator de entrelinha
        const MIN_SCALE = 0.6;     // menor redução de fonte aceita (≈ 5,7pt)

        const hymn = (name, num) => [num ? `Nº ${num}` : '', (name || '').trim()].filter(Boolean).join(' - ');

        function layoutPDF(a, s, allowBreak) {
            const pdf = new jsPDF('p', 'mm', 'a4');
            const W = pdf.internal.pageSize.getWidth();
            const H = pdf.internal.pageSize.getHeight();
            const M = 15, CW = W - M * 2, LIMIT = H - 12;
            const fs = 9.5 * s;
            const lh = fs * PT_TO_MM * LHF;
            const gap = 1.6 * s;
            let y = 16;

            const ensure = h => { if (allowBreak && y + h > LIMIT) { pdf.addPage(); y = 16; } };
            const setLabel = () => { pdf.setFont('helvetica', 'bold'); pdf.setFontSize(fs); pdf.setTextColor(100, 100, 100); };
            const setValue = () => { pdf.setFont('helvetica', 'normal'); pdf.setFontSize(fs); pdf.setTextColor(0, 0, 0); };

            // Cabeçalho
            pdf.setFont('helvetica', 'bold');
            pdf.setTextColor(0, 0, 0);
            pdf.setFontSize(13 * s);
            pdf.text('A IGREJA DE JESUS CRISTO DOS SANTOS DOS ÚLTIMOS DIAS', W / 2, y, { align: 'center' });
            y += 6.5 * s;
            pdf.setFontSize(11 * s);
            pdf.text(a.tipo_ata === 'testemunho' ? 'ATA DA REUNIÃO DE TESTEMUNHO' : 'ATA DA REUNIÃO SACRAMENTAL', W / 2, y, { align: 'center' });
            y += 10 * s;

            const section = title => {
                const h = 6 * s;
                ensure(h + lh * 2);
                const top = y - lh + gap;
                pdf.setFillColor(238, 240, 242);
                pdf.rect(M, top, CW, h, 'F');
                pdf.setFont('helvetica', 'bold');
                pdf.setFontSize(fs);
                pdf.setTextColor(44, 62, 80);
                pdf.text(title.toUpperCase(), M + 2, top + h * 0.7);
                y = top + h + lh + gap * 0.6;
            };

            // Linha com campos lado a lado; cada valor quebra dentro da própria coluna
            const row = items => {
                let x = M;
                const cells = items.map(([label, value, frac]) => {
                    const w = CW * frac;
                    setLabel();
                    const lab = label + ': ';
                    const lw = pdf.getTextWidth(lab);
                    setValue();
                    const lines = pdf.splitTextToSize(String(value ?? '').trim() || '__________', Math.max(w - lw - 3, 12));
                    const cell = { x, lab, lw, lines };
                    x += w;
                    return cell;
                });
                const maxLines = Math.max(...cells.map(c => c.lines.length));
                ensure(maxLines * lh);
                cells.forEach(c => {
                    setLabel(); pdf.text(c.lab, c.x, y);
                    setValue(); pdf.text(c.lines, c.x + c.lw, y, { lineHeightFactor: LHF });
                });
                y += maxLines * lh + gap;
            };

            // Bloco de texto livre em largura total
            const block = (label, value) => {
                const txt = String(value ?? '').trim();
                setLabel();
                const lab = label + ': ';
                if (!txt) {
                    ensure(lh);
                    pdf.text(lab, M, y);
                    setValue(); pdf.text('-', M + pdf.getTextWidth(lab), y);
                    y += lh + gap;
                    return;
                }
                ensure(lh * 2);
                pdf.text(lab, M, y);
                y += lh;
                setValue();
                pdf.splitTextToSize(txt, CW).forEach(line => {
                    ensure(lh);
                    pdf.text(line, M, y);
                    y += lh;
                });
                y += gap;
            };

            section('Informações Gerais');
            row([['Estaca', a.estaca, 1 / 3], ['Ala', a.ala, 1 / 3], ['Data', formatDate(a.data), 1 / 3]]);
            row([['Presidida por', a.presidida_por, 1 / 3], ['Dirigida por', a.dirigida_por, 1 / 3], ['Frequência', a.frequencia, 1 / 3]]);
            row([['Regente', a.regente, 1 / 3], ['Pianista/Organista', a.pianista, 2 / 3]]);

            section('Abertura');
            block('Boas-vindas / Reconhecimentos', a.boas_vindas);
            block('Anúncios', a.anuncios);
            row([['Hino de abertura', hymn(a.hino_abertura, a.hino_abertura_num), 0.6], ['1ª oração', a.primeira_oracao, 0.4]]);

            section('Ações');
            block('Ordenanças / Desobrigações / Apoios', a.acoes);

            section('Sacramento');
            row([['Hino sacramental', hymn(a.hino_sacramental, a.hino_sacramental_num), 1]]);

            if (a.tipo_ata === 'testemunho') {
                section('Testemunhos');
                const nomes = (a.testemunhos_lista || '').split('\n').map(n => n.trim()).filter(Boolean);
                block(`Prestaram testemunho (${nomes.length})`, nomes.join(', '));
            } else {
                section('Mensagens');
                row([['1º orador', a.primeiro_orador, 0.5], ['2º orador', a.segundo_orador, 0.5]]);
                row([['Interlúdio', hymn(a.interludio, a.interludio_num), 0.5], ['Último orador', a.ultimo_orador, 0.5]]);
                block('Observações', a.observacoes);
            }

            section('Encerramento');
            row([['Último hino', hymn(a.hino_encerramento, a.hino_encerramento_num), 0.6], ['Última oração', a.ultima_oracao, 0.4]]);

            return { pdf, bottom: y - lh, limit: LIMIT };
        }

        function generatePDF(ata) {
            // Reduz a fonte em passos de 5% até tudo caber em uma folha
            for (let s = 1; s >= MIN_SCALE - 1e-9; s -= 0.05) {
                const r = layoutPDF(ata, s, false);
                if (r.bottom <= r.limit) {
                    r.pdf.save(`Ata_${ata.tipo_ata === 'testemunho' ? 'Testemunho' : 'Sacramental'}_${ata.data}.pdf`);
                    if (s < 0.999) showToast(`PDF gerado em 1 folha (fonte reduzida para ${Math.round(s * 100)}%).`, 'info', 4000);
                    return;
                }
            }
            // Último recurso: conteúdo grande demais até com a fonte mínima
            layoutPDF(ata, MIN_SCALE, true).pdf.save(`Ata_${ata.tipo_ata}_${ata.data}.pdf`);
            showToast('Conteúdo longo demais: o PDF precisou de 2 folhas. Resuma anúncios ou ações.', 'error', 6000);
        }

        // --- Eventos ---

        tipoAtaSelect.addEventListener('change', toggleSections);

        form.addEventListener('input', e => {
            setDirty(true);
            if (e.target.tagName === 'TEXTAREA') autoGrow(e.target);
        });
        form.addEventListener('submit', e => { e.preventDefault(); saveAta(); });

        $('btn-nova').addEventListener('click', clearForm);
        $('btn-salvar').addEventListener('click', e => { e.preventDefault(); saveAta(); });

        // Gera o PDF do que está na tela, salvando antes se houver alterações
        $('btn-pdf').addEventListener('click', () => {
            const data = collectForm();
            if (!data.data) { showToast('Preencha a data antes de gerar o PDF.', 'error'); $('data').focus(); return; }
            if (isDirty || !$('ata-id').value) { if (!saveAta()) return; }
            generatePDF(data);
        });

        $('btn-exportar').addEventListener('click', exportBackup);
        $('btn-importar-trigger').addEventListener('click', () => $('import-file').click());
        $('import-file').addEventListener('change', importBackup);

        $('search-input').addEventListener('input', e => {
            currentFilter = e.target.value;
            renderList();
        });

        listContainer.addEventListener('click', e => {
            const item = e.target.closest('.ata-item');
            if (!item) return;
            const action = e.target.closest('[data-action]')?.dataset.action;
            const id = item.dataset.id;
            if (action === 'pdf') {
                const ata = atasCache.find(a => a.id === id);
                if (ata) generatePDF(ata);
            } else if (action === 'delete') {
                deleteAta(id);
            } else {
                editAta(id);
            }
        });

        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                saveAta();
            }
        });

        window.addEventListener('beforeunload', e => {
            if (isDirty) { e.preventDefault(); e.returnValue = ''; }
        });
        window.addEventListener('online', () => updateStatus('saving'));
        window.addEventListener('offline', () => { updateStatus('offline'); statusText.textContent = 'Sem internet: alterações ficam salvas no aparelho'; });

        loadAtas();
        toggleSections();
    </script>
</body>
</html>
