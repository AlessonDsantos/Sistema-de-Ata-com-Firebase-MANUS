<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Agenda · Ala Vila Matilde</title>
    <meta name="description" content="Atividades da Ala Vila Matilde">
    <link rel="manifest" href="agenda.webmanifest">
    <meta name="theme-color" content="#2c3e50">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Agenda da Ala">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="publica">
    <header>
        <div class="header-title">
            <h1><i class="fas fa-church"></i> Ala Vila Matilde</h1>
            <div class="header-sub">Agenda de atividades</div>
        </div>
        <div class="header-status">
            <button class="btn btn-instalar hidden" id="btn-instalar-header" title="Instalar a agenda neste aparelho"><i class="fas fa-download"></i> <span class="lbl-inst">Instalar</span></button>
            <a class="btn btn-instalar" href="index.html" title="Área restrita (login)"><i class="fas fa-lock"></i> <span class="lbl-inst">Entrar</span></a>
        </div>
    </header>

    <main class="disc-main agenda-main">
        <section class="card">
            <div class="cal-head">
                <button class="btn btn-light btn-sm" id="pub-prev" title="Mês anterior"><i class="fas fa-chevron-left"></i></button>
                <div class="cal-titulo" id="pub-titulo" style="cursor:default;"></div>
                <button class="btn btn-light btn-sm" id="pub-next" title="Próximo mês"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div id="pub-grade" class="cal-grid"></div>
            <div class="ag-legenda" id="pub-legenda"></div>
        </section>
        <section class="card">
            <div class="card-title"><span>Próximas atividades</span></div>
            <div id="pub-lista" class="ag-lista"><p class="empty-msg">Carregando...</p></div>
        </section>
    </main>

    <div class="modal-overlay hidden" id="modal-pub">
        <div class="modal modal-sm">
            <div class="modal-head">
                <h2>Atividade</h2>
                <button class="modal-close" data-close title="Fechar">&times;</button>
            </div>
            <div class="modal-body" id="pub-detalhe"></div>
        </div>
    </div>

    <div class="install-banner hidden" id="install-banner">
        <img src="icons/icon-192.png" alt="">
        <div class="ib-texto">
            <b>Tenha a agenda da ala no celular</b>
            <span id="ib-msg">Instale para abrir direto da tela inicial.</span>
        </div>
        <div class="ib-acoes">
            <button class="btn btn-primary btn-sm" id="ib-instalar">Instalar</button>
            <button class="btn btn-light btn-sm" id="ib-depois">Agora não</button>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script type="module" src="js/agenda-publica.js"></script>
</body>
</html>
